plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ali.englishassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.ali.englishassistant"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // On-device English<->Urdu translation. Works offline after a one-time
    // model download; no API key, no quota. Models are fetched at runtime,
    // so they do not bloat the APK.
    implementation 'com.google.mlkit:translate:17.0.3'
}
